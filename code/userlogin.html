<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"/>
    <link rel="icon" href="/code/favicon/Password Logo.jpg" type="image/jpeg"/>
    <title>User Login</title>
</head>
<body>
    <div>
        <h1>Create Your Account Login</h1>
        
        <form onsubmit="return login(event)">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">

            <label for="password">Password:</label>
            <input type="password" id="password" name="password">

            <button type="submit">Login</button>
        </form>
    </div>
    
    <script>
        function login(event) {
            // Prevent the form from refreshing the page
            event.preventDefault(); 
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if(!email || !password || !username){
                alert('Please enter your email, username, and password.');
                return false;
            }
            
            if (username === 'bubblegum' && email === 'bubblegumboy12@gmail.com' && password === 'bubblegum45$') {
                window.location.href = 'passwordmanagement.html';
                return true;
            } else {
                alert('Incorrect username, email, or password. Please try again.');
                return false;
            }
        }
    </script>
</body>
</html>
