<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"/>
    <link rel="icon" href="/code/favicon/Password Logo.jpg" type="image/jpeg"/>
    <title>Password Management</title>
</head>
<body>
    <div>
        <h3>My Passwords</h3>
        
        <div class="form-group">
            <input type="text" id="website" placeholder="Website (e.g., GitHub)">
            <input type="text" id="password" placeholder="Generated Password">
            <button onclick="fillGeneratedPassword()">Generate Secure Password</button>
            <button onclick="saveToVault()">Save to Vault</button>
        </div>

        <hr>
        <div id="vaultDisplay"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
